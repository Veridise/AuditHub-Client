[tool.poetry]
name = "audithub-client"
version = "1.1.18"
description = "A Python client that can access Veridise AuditHub via its REST API, providing CLI access"
authors = ["Nikos Chondros <nikos@veridise.com>"]
license = "AGPLv3"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
websockets = "*"
tabulate = "*"
cyclopts = "*"
humanize = "*"
httpx = "*"
pydantic = "*"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "*"
isort = "*"
ruff = "*"
mypy = "*"
types-tabulate = "*"
pre-commit = "*"
pre-commit-hooks = "*"

[tool.isort]
profile = "black"
src_paths = ["audithub_client"]

[tool.ruff.lint]
extend-ignore = [
    "PLC0414", # Import alias is identical to the original name.
    "B006", # Mutable data structures used as argument defaults.
    "PLW0602", # Global variable declared without assignment in the function.
    "SIM117", # Nested with statements that can be combined into one.
    "EXE001", # Shebang is present but the file is not executable.
    "UP045", # Replace Optional[X] annotations with X | None.
]


[tool.poetry.scripts]
ah = "audithub_client.__main__:main"
