name: Docker Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version tag (e.g. v1.2.3)"
        required: true
        type: string

jobs:
  docker-build:
    name: Build and Push Docker Image
    runs-on: dev

    steps:
      - name: Resolve and validate image tag
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            IMAGE_TAG="$MANUAL_VERSION"
          else
            IMAGE_TAG="$GITHUB_REF_NAME"
          fi

          if [[ ! "$IMAGE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Docker image tag: expected v<number>.<number>.<number> (e.g. v1.2.3)." >&2
            exit 1
          fi

          printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          # Caching options
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The actual build arguments
          context: .
          file: ./Dockerfile
          tags: |
            veridise/audithub-client:${{ env.IMAGE_TAG }}
          push: false
          load: true

      - name: Run Trivy vulnerability scanner on the image
        env:
          # if primary fails, this will use ghcr.io as the primary and public.ecr.aws then.
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "veridise/audithub-client:${{ env.IMAGE_TAG }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          output: "trivy-scan.txt"

      - name: Publish Trivy Output to Summary
        if: failure() # run this step if previous step failed
        run: |
          if [[ -s trivy-scan.txt ]]; then
            {
              echo "### Security Output"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```terraform'
              cat trivy-scan.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push image
        if: success()
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: veridise/audithub-client:latest, veridise/audithub-client:${{ env.IMAGE_TAG }}
          # Caching options
          cache-from: type=gha
          cache-to: type=gha,mode=max
